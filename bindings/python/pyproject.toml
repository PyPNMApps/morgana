[build-system]
requires = ["maturin==1.8.3"]
build-backend = "maturin"

[project]
name = "morgana-ofdma"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Native Python access to MORGANA's safe Rust upstream OFDMA stages"
license = { text = "Apache-2.0" }

[tool.maturin]
bindings = "pyo3"
module-name = "morgana._native"
python-source = "python"

include = [{ path = "wheel-notices/**/*", format = "wheel" }]
