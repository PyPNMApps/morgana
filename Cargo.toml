[workspace]
members = ["crates/ldpc", "crates/morgana", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
morgana-ldpc = { path = "crates/ldpc", version = "=0.1.0" }
morgana = { path = "crates/morgana", version = "=0.1.0" }
ldpc-toolbox = "=0.10.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rand = "=0.9.5"
rand_chacha = "=0.9.0"
rand_distr = "=0.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0
